<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegalMatchingPlatform — Wireframe Flow</title>
<style>
  :root{
    --navy:#1B2A4A; --navy-deep:#121D33; --ice:#EDF2FA; --gold:#C9A227;
    --slate:#5B6B85; --white:#FFFFFF; --border:#DCE3EF; --border-strong:#C7D0E3;
    --ink:#1B2A4A; --body:#33404E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--navy-deep);
    background-image:radial-gradient(circle at 15% 10%, #1f2f52 0%, var(--navy-deep) 45%);
    color:var(--white);
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 48px;
  }
  header{width:100%; max-width:1000px; text-align:center; margin-bottom:6px;}
  header h1{font-size:20px; margin:0 0 4px; font-weight:600; letter-spacing:.2px;}
  header p{font-size:12.5px; color:#AAB6CC; margin:0;}

  .tabs{display:flex; gap:8px; margin:20px 0 6px; background:rgba(255,255,255,.06); padding:4px; border-radius:10px;}
  .tab{border:none; background:transparent; color:#C6D0E4; font-size:13px; font-weight:600; padding:8px 18px; border-radius:8px; cursor:pointer; transition:background .15s,color .15s;}
  .tab.active{background:var(--gold); color:var(--navy-deep);}
  .tab:not(.active):hover{background:rgba(255,255,255,.08); color:#fff;}

  .track{display:flex; align-items:center; gap:6px; margin:14px 0 26px; flex-wrap:wrap; justify-content:center; max-width:700px;}
  .node{display:flex; align-items:center; gap:6px; cursor:pointer; padding:5px 10px; border-radius:16px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04);}
  .node.current{background:var(--gold); border-color:var(--gold);}
  .node.current .dot{background:var(--navy-deep);}
  .node .dot{width:6px;height:6px;border-radius:50%;background:#7A88A3;}
  .node span{font-size:11px; color:#C6D0E4; font-weight:500; white-space:nowrap;}
  .node.current span{color:var(--navy-deep); font-weight:700;}
  .arrow{color:#5B6B85; font-size:12px;}

  .stage{display:flex; flex-direction:column; align-items:center;}
  .phone{width:300px; border:3px solid var(--navy); border-radius:34px; padding:8px; background:var(--white); box-shadow:0 20px 50px rgba(0,0,0,.45);}
  .notch{width:90px; height:16px; background:var(--navy); border-radius:0 0 12px 12px; margin:0 auto 0;}
  .screen{border-radius:24px; overflow:hidden; background:var(--white); color:var(--ink); min-height:560px; display:flex; flex-direction:column;}
  .status{display:flex; justify-content:space-between; padding:8px 16px 0; font-size:11px; color:var(--slate);}
  .titlebar{background:var(--navy); color:var(--white); display:flex; align-items:center; justify-content:space-between; padding:10px 12px; font-size:12px; font-weight:700; letter-spacing:.4px; margin-top:6px;}
  .titlebar .chip{font-size:10.5px; font-weight:600; cursor:pointer; opacity:.9;}
  .titlebar .chip:hover{opacity:1; text-decoration:underline;}
  .titlebar .mid{flex:1; text-align:center;}
  .body{padding:16px; flex:1; display:flex; flex-direction:column;}

  .avatar{width:60px; height:60px; border-radius:50%; border:1.5px solid var(--navy); display:flex; align-items:center; justify-content:center; margin:18px auto 10px; font-weight:700; font-size:13px; color:var(--navy);}
  .brand{text-align:center; font-weight:700; font-size:15px; margin-bottom:2px;}
  .brand-sub{text-align:center; font-size:12px; color:var(--slate); margin-bottom:20px;}
  .field{border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--slate); margin-bottom:12px;}
  .link{color:var(--gold); font-size:12px; text-decoration:none; cursor:pointer;}
  .link:hover{text-decoration:underline;}
  .btn{background:var(--navy); color:var(--white); text-align:center; padding:12px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; border:none; width:100%; letter-spacing:.3px;}
  .btn:hover{background:var(--navy-deep);}
  .btn-outline{background:var(--white); color:var(--navy); border:1px solid var(--border-strong);}
  .foot-link{text-align:center; font-size:11.5px; color:var(--slate); margin-top:14px;}

  .greet{font-size:12px; color:var(--slate);}
  .name{font-size:16px; font-weight:700; margin-bottom:14px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{border:1px solid var(--border-strong); border-radius:10px; padding:18px 6px; text-align:center; font-size:11.5px; font-weight:700; color:var(--navy); cursor:pointer; position:relative; background:var(--white);}
  .tile:hover{border-color:var(--navy); background:var(--ice);}
  .tile.dim{cursor:default; color:var(--slate); opacity:.55;}
  .tile.dim:hover{border-color:var(--border-strong); background:var(--white);}
  .badge-count{position:absolute; top:-6px; right:-6px; background:var(--navy); color:#fff; font-size:9.5px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .tile-dark{background:var(--navy); color:#fff;}

  .steps{display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:16px; font-size:10px; color:var(--border-strong);}
  .step-dot{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:9.5px; color:var(--slate); font-weight:700;}
  .step-dot.done{background:var(--navy); border-color:var(--navy); color:#fff;}
  .step-dot.now{border-color:var(--gold); color:var(--gold);}
  .step-line{width:16px; height:1px; background:var(--border-strong);}
  .label{font-size:10.5px; font-weight:700; color:var(--navy); margin-bottom:5px; letter-spacing:.2px;}
  .pillgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:14px;}
  .pill{border:1px solid var(--border-strong); border-radius:6px; padding:8px 4px; text-align:center; font-size:10px; font-weight:600; color:var(--navy); cursor:pointer;}
  .pill.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  textarea.field{resize:none; font-family:inherit; height:64px;}
  .note{font-size:10.5px; color:var(--slate); border:1px dashed var(--border-strong); border-radius:6px; padding:8px 10px; margin:6px 0 14px;}

  .case-card{border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; cursor:pointer;}
  .case-card:hover{border-color:var(--navy);}
  .case-card .top{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700;}
  .score{color:var(--gold);}
  .tagrow{display:flex; gap:5px; margin:6px 0; flex-wrap:wrap;}
  .tag{font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; background:var(--ice); color:var(--navy); border:1px solid var(--border);}
  .tag.top{background:var(--navy); color:#fff; border:none;}
  .tag.limited{background:#FBEFE0; color:#8A5A00; border:none;}
  .case-desc{font-size:10.5px; color:var(--slate); line-height:1.5;}
  .summary-box{background:var(--ice); border-radius:10px; padding:10px 12px; margin-bottom:12px;}
  .summary-box .t1{font-size:11.5px; font-weight:700;}
  .summary-box .t2{font-size:10.5px; color:var(--slate);}

  .stats3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:14px 0;}
  .stat{border:1px solid var(--border); border-radius:8px; text-align:center; padding:8px 2px;}
  .stat b{display:block; font-size:15px; color:var(--navy);}
  .stat span{font-size:9px; color:var(--slate);}
  .history-item{display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); font-size:11px;}
  .history-item .t{font-weight:600;}
  .history-item .d{font-size:9.5px; color:var(--slate);}
  .result-tag{font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px;}
  .result-tag.won{background:var(--navy); color:#fff;}
  .result-tag.settled{background:var(--ice); color:var(--navy); border:1px solid var(--border);}
  .result-tag.ongoing{background:#fff; color:var(--slate); border:1px dashed var(--border-strong);}

  .stats-card{border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:8px;}
  .stats-card .h{font-size:11px; font-weight:700; margin-bottom:8px;}
  .stats-card .row{display:flex; justify-content:space-between; font-size:11px; color:var(--slate); padding:4px 0;}
  .stats-card .row b{color:var(--navy);}

  /* AI feature styles */
  .ai-badge{display:inline-flex; align-items:center; gap:3px; font-size:8.5px; font-weight:700; letter-spacing:.4px; padding:2px 6px; border-radius:10px; background:var(--gold); color:var(--navy-deep);}
  .ai-badge.soft{background:var(--ice); color:var(--gold); border:1px solid var(--gold);}
  .ai-note{font-size:9.5px; color:var(--gold); font-weight:600;}
  .titlebar .ai-badge{margin-left:6px;}

  .chat{flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding:4px 0 8px;}
  .bubble{max-width:80%; font-size:11px; line-height:1.5; padding:9px 11px; border-radius:12px;}
  .bubble.ai{align-self:flex-start; background:var(--ice); color:var(--ink); border-bottom-left-radius:3px;}
  .bubble.me{align-self:flex-end; background:var(--navy); color:#fff; border-bottom-right-radius:3px;}
  .bubble.draft{align-self:flex-start; background:#fff; border:1px dashed var(--gold); color:var(--ink); border-bottom-left-radius:3px;}
  .chat-input{display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:20px; padding:8px 12px; font-size:11px; color:var(--slate); margin:6px 0 10px;}

  .viewfinder{border:2px dashed var(--border-strong); border-radius:12px; background:var(--ice); height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--slate); font-size:10.5px; margin-bottom:12px;}
  .viewfinder .cam{font-size:26px; opacity:.5;}
  .extract-box{border:1px solid var(--gold); border-radius:10px; padding:11px 12px; margin-bottom:14px; background:#FFFDF5;}
  .extract-box .eh{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; color:var(--navy); margin-bottom:8px;}
  .extract-row{display:flex; justify-content:space-between; font-size:10.5px; padding:3px 0; color:var(--slate);}
  .extract-row b{color:var(--navy); font-weight:600;}

  .inquiry-card{border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:10px;}
  .inquiry-card .ih{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; color:var(--navy);}
  .inquiry-card .meta{font-size:9.5px; color:var(--slate); margin:2px 0 6px;}
  .ai-summary{background:var(--ice); border-radius:8px; padding:8px 9px; font-size:10px; line-height:1.5; color:var(--body);}
  .ai-summary .sh{display:flex; align-items:center; gap:5px; font-size:8.5px; font-weight:700; color:var(--gold); letter-spacing:.4px; margin-bottom:4px;}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff; padding:12px 22px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .caption{margin-top:16px; text-align:center; font-size:11.5px; color:#8493AD;}
  .caption b{color:#E7ECF6;}
  footer{margin-top:34px; font-size:10.5px; color:#5B6B85; text-align:center;}
</style>
</head>

const titles = {
  'client-login':'Client &#8226; Login','client-dashboard':'Client &#8226; Dashboard',
  'ai-assistant':'Client &#8226; AI Assistant (Chat Intake)','scan-document':'Client &#8226; Scan Document',

  'lawyer-login':'Lawyer &#8226; Login','lawyer-dashboard':'Lawyer &#8226; Dashboard',
  'lawyer-inquiries':'Lawyer &#8226; Inquiries (AI Summaries)'
};

function flowFor(id){
  if(clientOrder.some(n=>n[0]===id)) return 'client';
  return 'lawyer';
}

function render(){
  document.getElementById('screen').innerHTML = screens[currentId];
  document.getElementById('caption').innerHTML = '<b>'+titles[currentId]+'</b>';
  const flow = flowFor(currentId);
  document.getElementById('tabClient').classList.toggle('active', flow==='client');
  document.getElementById('tabLawyer').classList.toggle('active', flow==='lawyer');
  renderTrack(flow);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderTrack(flow){
  const order = flow==='client' ? clientOrder : lawyerOrder;
  const track = document.getElementById('track');
  track.innerHTML = '';
  order.forEach((n,i)=>{
    const node = document.createElement('div');
    node.className = 'node' + (n[0]===currentId ? ' current' : '');
    node.innerHTML = '<span class="dot"></span><span>'+n[1]+'</span>';
    node.onclick = () => go(n[0]);
    track.appendChild(node);
    if(i < order.length-1){
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '\u2192';
      track.appendChild(arrow);
    }
  });
}

function go(id){
  if(currentId && currentId !== id) history.push(currentId);
  currentId = id;
  render();
}

function back(){
  if(history.length){
    currentId = history.pop();
    render();
  }
}

function startFlow(flow){
  history = [];
  currentId = flow==='client' ? 'client-login' : 'lawyer-login';
  render();
}

function pick(el){
  el.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function confirmSelection(){
  showToast('Selection confirmed \u2014 Mary Kamau will be in touch within 24 hrs');
  setTimeout(()=>go('client-dashboard'), 550);
}

startFlow('client');
</script>
